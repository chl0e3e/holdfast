<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Holdfast</title>
    <link rel="stylesheet" href="/node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="topbar">
      <div id="tabs"></div>
      <div id="actions">
        <button id="font-smaller" title="Smaller text (or Ctrl+scroll)">A&minus;</button>
        <button id="font-larger" title="Larger text (or Ctrl+scroll)">A+</button>
        <button id="add-server" title="Add a server">+ server</button>
        <button id="detach" title="Detach: shell keeps running">detach</button>
        <button id="terminate" title="Terminate: kill the shell">terminate</button>
      </div>
      <div id="status" data-kind="warn">starting…</div>
    </header>
    <main id="panels"></main>

    <dialog id="add-server-dialog">
      <form method="dialog" id="add-server-form">
        <h2>Add server</h2>
        <label>URL <input id="srv-url" placeholder="https://host or http://127.0.0.1:8080" required /></label>
        <label>Name <input id="srv-name" placeholder="display name" /></label>
        <label>Username <input id="srv-user" placeholder="username" /></label>
        <label>SSH key path <input id="srv-key" placeholder="C:\Users\me\.ssh\id_ed25519 (empty = password login)" /></label>
        <p class="hint">Username + key: SSH auth. Username only: password login (asked on connect). Both empty: loopback dev daemons.</p>
        <menu>
          <!-- type=button, NOT a submit: the first submit button in a form is
               what Enter activates, so a submit-Cancel placed first silently
               swallowed Enter-confirmed input. -->
          <button type="button" id="srv-cancel">Cancel</button>
          <button id="srv-submit" value="default">Add</button>
        </menu>
      </form>
    </dialog>

    <dialog id="login-dialog">
      <form method="dialog" id="login-form">
        <h2>Log in</h2>
        <p id="login-target"></p>
        <p id="login-error" class="hint" hidden></p>
        <label>Password <input id="login-password" type="password" autocomplete="current-password" /></label>
        <menu>
          <button type="button" id="login-cancel">Cancel</button>
          <button value="default">Log in</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
