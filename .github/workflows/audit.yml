# Dependency + build gate (threat model T11: supply chain).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch: # manual: also builds the desktop NSIS installer
  schedule:
    - cron: "0 6 * * 1" # weekly, catches newly disclosed advisories
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # hf-auth links against PAM (ADR 0015/0016); runners don't ship the dev lib.
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: cargo test --workspace --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run build

  # Windows portability gate for the client crates (ADR 0019): the desktop
  # app ships on Windows first, so unix-only deps leaking into these graphs
  # must fail CI, not the first Windows build.
  windows-client-libs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check -p hf-native-client --lib --locked
      - run: cargo check -p hf-client-core --locked

  # Desktop app (standalone workspace, ADR 0019): frontend typecheck+build,
  # then compile the Tauri crate. Bundling the NSIS installer is manual
  # (workflow_dispatch) to keep push CI fast.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo check --locked
        working-directory: desktop/src-tauri

  desktop-installer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop
      - run: cargo install tauri-cli --version ^2 --locked
      # NSIS bundling paused for faster iteration — restore plain
      # `cargo tauri build` (and the bundle/nsis path below) for a release.
      - run: cargo tauri build --no-bundle
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: holdfast-desktop-nsis
          path: desktop/src-tauri/target/release/hf-desktop.exe
