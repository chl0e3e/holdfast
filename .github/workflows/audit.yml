# Dependency + build gate (threat model T11: supply chain).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches newly disclosed advisories
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run build
