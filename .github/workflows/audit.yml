# Dependency + build gate (threat model T11: supply chain).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch: # manual: also builds the desktop exe (installer opt-in)
    inputs:
      installer:
        description: "Also bundle the NSIS installer (slower; for releases)"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1" # weekly, catches newly disclosed advisories
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # hf-auth links against PAM (ADR 0015/0016); runners don't ship the dev lib.
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: cargo test --workspace --locked
      # Width tables must match the committed authority (ADR 0026). This
      # compares the three generated files against the dump in the repo — it
      # deliberately does NOT re-measure the runner's own glibc, which is a
      # different version from the deployment's and would fail on every
      # ubuntu-latest image bump. Changing the reference glibc is an ADR
      # decision, made by regenerating the dump on purpose.
      - run: cargo run -p hf-xterm-width-tables --locked -- --check
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      # The web suite was never run in CI, so its width parity pins — the ones
      # that catch a client drifting from the server model — were unenforced.
      - run: npm test
      - run: npm run build

  # Windows portability gate for the client crates (ADR 0019): the desktop
  # app ships on Windows first, so unix-only deps leaking into these graphs
  # must fail CI, not the first Windows build.
  windows-client-libs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pwsh ./desktop/scripts/prepare-msquic.ps1
      - run: cargo check -p hf-native-client --lib --locked
      - run: cargo check -p hf-client-core --locked

  # Desktop app (standalone workspace, ADR 0019): frontend typecheck+build,
  # then compile the Tauri crate. Bundling the NSIS installer is manual
  # (workflow_dispatch) to keep push CI fast.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo check --locked
        working-directory: desktop/src-tauri

  desktop-installer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: desktop
      - run: cargo install tauri-cli --version ^2 --locked
      # NSIS bundling is opt-in (dispatch input) so iteration builds stay fast.
      - if: ${{ !inputs.installer }}
        run: cargo tauri build --no-bundle
        working-directory: desktop
      - if: ${{ inputs.installer }}
        run: cargo tauri build
        working-directory: desktop
      - run: |
          $deps = & $env:DUMPBIN_EXE /dependents desktop/src-tauri/target/release/hf-desktop.exe | Out-String
          if ($deps -notmatch "msquic\.dll") { throw "desktop exe does not import msquic.dll" }
          if ($deps -match "msquic\.sys") { throw "desktop exe still imports the broken msquic.sys name" }
      - uses: actions/upload-artifact@v4
        with:
          name: holdfast-desktop-nsis
          path: |
            desktop/src-tauri/target/release/hf-desktop.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
