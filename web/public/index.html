<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holdfast</title>
<link rel="stylesheet" href="xterm.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0d1117; color: #e6edf3;
    font-family: system-ui, sans-serif; font-size: 14px;
  }
  header {
    display: flex; align-items: center; gap: .5rem;
    padding: .4rem .6rem; background: #161b22; border-bottom: 1px solid #30363d;
  }
  header h1 { font-size: 1rem; margin: 0 .6rem 0 0; font-weight: 600; }
  #tabs { display: flex; gap: .3rem; flex: 1; overflow-x: auto; }
  #tabs button {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 6px; padding: .25rem .6rem; cursor: pointer; white-space: nowrap;
  }
  #tabs button.active { background: #1f6feb33; border-color: #1f6feb; }
  #tabs button[data-state="exited"] { color: #f85149; }
  #tabs button[data-state="detached"],
  #tabs button[data-state="reconnecting"] { color: #d29922; }
  .actions button {
    background: #21262d; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 6px; padding: .25rem .6rem; cursor: pointer;
  }
  #terminate { color: #f85149; }
  #status { font-size: .8rem; padding: .15rem .5rem; border-radius: 6px; }
  #status[data-kind="ok"] { color: #3fb950; }
  #status[data-kind="warn"] { color: #d29922; }
  #status[data-kind="err"] { color: #f85149; }
  #panels { flex: 1; min-height: 0; }
  dialog {
    background: #161b22; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 8px; padding: 1.2rem; max-width: 34rem; width: 90%;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin-top: 0; font-size: 1.1rem; }
  dialog label { display: block; margin: .6rem 0; font-size: .85rem; color: #8b949e; }
  dialog input, dialog textarea {
    display: block; width: 100%; margin-top: .25rem; padding: .4rem;
    background: #0d1117; color: #e6edf3; border: 1px solid #30363d;
    border-radius: 6px; font-family: monospace; font-size: .85rem;
  }
  dialog pre {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: .6rem; overflow-x: auto; font-size: .8rem; user-select: all;
  }
  dialog button {
    background: #238636; color: #fff; border: 0; border-radius: 6px;
    padding: .4rem .9rem; cursor: pointer; margin-top: .4rem;
  }
  #login-error { color: #f85149; font-size: .85rem; min-height: 1em; }
  .login-alt { font-size: .85rem; margin: .4rem 0 0; }
  .login-alt a { color: #58a6ff; }
  .panel { height: 100%; padding: .4rem; display: none; }
  .panel .xterm { height: 100%; }
</style>
</head>
<body>
<header>
  <h1>Holdfast</h1>
  <div id="tabs"><button id="new-shell" title="Open a new shell">+</button></div>
  <div class="actions">
    <button id="font-smaller" title="Smaller text (or Ctrl+scroll)">A&minus;</button>
    <button id="font-larger" title="Larger text (or Ctrl+scroll)">A+</button>
    <button id="detach" title="Detach: shell keeps running">Detach</button>
    <button id="terminate" title="Terminate: kills the shell">Terminate</button>
  </div>
  <span id="status" data-kind="warn">starting…</span>
</header>
<div id="panels"></div>
<dialog id="login">
  <h2>Sign in</h2>
  <label>Username
    <input id="login-username" autocomplete="username" spellcheck="false">
  </label>
  <div id="login-password-section" hidden>
    <label>Password
      <input id="login-password" type="password" autocomplete="current-password">
    </label>
    <button id="login-password-submit">Sign in</button>
    <p class="login-alt"><a href="#" id="login-use-key">Use an SSH key instead</a></p>
  </div>
  <div id="login-step1">
    <label>Public key (paste your <code>~/.ssh/id_*.pub</code> line)
      <textarea id="login-pubkey" rows="3" spellcheck="false"></textarea>
    </label>
    <button id="login-request">Request challenge</button>
    <p class="login-alt" hidden id="login-use-password-line"><a href="#" id="login-use-password">Use a password instead</a></p>
  </div>
  <div id="login-step2" hidden>
    <p>Run this on the machine that holds your private key, then paste the
    output below. The signed blob is bound to this server's certificate, so
    it is useless anywhere else.</p>
    <pre id="login-command"></pre>
    <label>Signature (<code>-----BEGIN SSH SIGNATURE-----&hellip;</code>)
      <textarea id="login-signature" rows="8" spellcheck="false"></textarea>
    </label>
    <button id="login-submit">Sign in</button>
  </div>
  <p id="login-error"></p>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
