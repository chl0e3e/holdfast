[workspace]
resolver = "2"
# The desktop app is its own workspace: building it needs platform GUI
# toolchains (WebView2 on Windows, webkit2gtk on Linux) that must not become
# a prerequisite for `cargo test --workspace` on the core repo.
# Patched third-party crates are excluded so their own test/bench dev-deps stay
# out of the workspace graph. h3-wt-client and msquic-async-schannel are used
# only by hf-native-client's Windows transport (ADR 0022).
exclude = [
    "desktop/src-tauri",
    "vendor/avt",
    "vendor/h3-wt-client",
    "vendor/msquic-async-schannel",
    "spikes/msquic-schannel",
]
members = [
    "crates/protocol",
    "crates/daemon",
    "crates/transport",
    "crates/terminal-model",
    "crates/session-core",
    "crates/launch",
    "crates/spawner",
    "crates/pty",
    "crates/gateway",
    "crates/control-plane",
    "crates/ssh-backend",
    "crates/auth",
    "crates/agent",
    "crates/native-client",
    "crates/client-core",
    "crates/ssh-adapter",
    "tools/xterm-width-tables",
    "spikes/webtransport-echo",
    "spikes/pty-spike",
    "spikes/encoding-spike",
    "spikes/terminal-model-spike",
]

[workspace.package]
edition = "2021"
version = "0.0.4"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
wtransport = { version = "0.7", features = ["quinn"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
http = "1"
time = "0.3"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
bytes = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
nix = { version = "0.31", features = ["process", "signal", "term"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rcgen = "0.14"
avt = "0.18"
rand = "0.9"
sha2 = "0.10"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
tokio-tungstenite = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
libc = "0.2"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
russh = { version = "0.62.2", default-features = false, features = ["ring", "rsa"] }
rand-10 = { package = "rand", version = "0.10" }
zeroize = "1"

# Zero-width fix (2026-08-03): upstream avt 0.18 gives width-0 characters
# (combining marks, ZWJ, VS16) a full cell, so the server model's cursor
# drifts one column per mark and attach snapshots replay a sheared screen.
# The vendored fork attaches them to the preceding cell without advancing,
# matching wcwidth and xterm.js. Drop when upstream avt handles zero-width.
[patch.crates-io]
avt = { path = "vendor/avt" }
# h3 0.0.8 cannot advertise WebTransport from a client without this one-method
# patch. It remains wire-compatible with the daemon's h3-quinn server.
h3 = { path = "vendor/h3-wt-client" }

# Crate dependency direction (enforced by review until tooling exists):
#   protocol, terminal-model, pty        -> no HTTP/QUIC imports
#   transport                            -> protocol only
#   session-core                         -> protocol, terminal-model, pty
#   gateway, control-plane, agent, ...   -> may depend on the above
#   control-plane                        -> must never parse terminal bytes

[profile.release]
lto = "thin"
