[package]
name = "hf-daemon"
description = "holdfastd: standalone Holdfast terminal daemon (WebSocket listener in Phase 2; WebTransport/QUIC arrive in Phase 3)."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "holdfastd"
path = "src/main.rs"

[lib]
name = "hf_daemon"
path = "src/lib.rs"

[features]
default = []
agent-mode = ["dep:hf-agent", "dep:rustls-pemfile"]

[dependencies]
hf-protocol = { path = "../protocol" }
hf-session-core = { path = "../session-core" }
hf-agent = { path = "../agent", optional = true }
axum.workspace = true
h3.workspace = true
h3-quinn.workspace = true
h3-webtransport.workspace = true
http.workspace = true
quinn.workspace = true
rcgen.workspace = true
bytes.workspace = true
sha2.workspace = true
time.workspace = true
hf-auth = { path = "../auth" }
tower-http.workspace = true
tokio.workspace = true
futures-util.workspace = true
prost.workspace = true
rand.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls-pki-types.workspace = true
zeroize.workspace = true
rustls.workspace = true
rustls-pemfile = { workspace = true, optional = true }

[dev-dependencies]
wtransport.workspace = true
tokio-tungstenite.workspace = true
h3.workspace = true
h3-quinn.workspace = true
quinn.workspace = true
http.workspace = true
rustls.workspace = true
sha2.workspace = true
bytes.workspace = true
futures-util.workspace = true
hf-gateway = { path = "../gateway" }
rcgen.workspace = true
ssh-key = { version = "0.6", features = ["ed25519", "std", "getrandom"] }
base64.workspace = true
