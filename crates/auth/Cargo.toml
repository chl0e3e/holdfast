[package]
name = "hf-auth"
description = "Connection grants and the local SSH-key issuer (spec §5)."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
rand.workspace = true
ssh-key.workspace = true
ed25519-dalek.workspace = true

[dev-dependencies]
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "p256", "std", "getrandom"] }
sha2.workspace = true
# Only to *produce* an sk-ecdsa signature in tests; verification is ssh-key's.
p256 = { version = "0.13", features = ["ecdsa"] }
