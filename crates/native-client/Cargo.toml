[package]
name = "hf-native-client"
description = "Native terminal client (hf): WebTransport sessions in your real terminal."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hf"
path = "src/main.rs"

[lib]
name = "hf_native_client"
path = "src/lib.rs"

[dependencies]
hf-protocol = { path = "../protocol" }
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "ecdsa", "std"] }
hf-auth = { path = "../auth" }
rand.workspace = true
dirs.workspace = true
thiserror.workspace = true
sha2.workspace = true

[target.'cfg(not(windows))'.dependencies]
wtransport.workspace = true

# The hf CLI binary is unix-only (raw mode, SIGWINCH); the lib stays portable.
# Verify with: cargo check -p hf-native-client --lib --target x86_64-pc-windows-msvc
[target.'cfg(unix)'.dependencies]
nix.workspace = true
libc.workspace = true

# Windows desktop builds use MsQuic's Schannel TLS provider. These dependencies
# are target-only: Linux/macOS and holdfastd remain on wtransport/quinn/rustls.
# `msquic` deliberately uses the official prebuilt DLL (`find`); see
# desktop/scripts/prepare-msquic.ps1 and ADR 0022.
[target.'cfg(windows)'.dependencies]
bytes.workspace = true
h3 = { workspace = true, features = ["i-implement-a-third-party-backend-and-opt-into-breaking-changes"] }
http.workspace = true
msquic = { version = "2.5.1-beta", default-features = false, features = ["find"] }
msquic-async = { path = "../../vendor/msquic-async-schannel", default-features = false, features = ["msquic-2-5", "tokio"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography"] }

[dev-dependencies]
ssh-key = { version = "0.6", features = ["ed25519", "std", "getrandom"] }

# The integration tests spawn a real daemon, which is unix-only (pty, pam).
[target.'cfg(unix)'.dev-dependencies]
hf-daemon = { path = "../daemon" }
