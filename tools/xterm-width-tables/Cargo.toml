[package]
name = "hf-xterm-width-tables"
description = "Generates the clients' xterm.js width provider from the same unicode-width tables the server model (vendored avt) uses, so wrap points agree end to end."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Same requirement avt declares, so the workspace lock resolves both to one
# version and the generated tables can never drift from the server model.
# NOTE: since ADR 0026 this crate is no longer the width *authority* — it is
# kept so `--example uwdump` can still show what the crate would have said,
# which is how the committed glibc dump gets audited.
unicode-width = "0.1.13"
# `--example glibcdump` calls wcwidth(3) directly. This is the measurement
# ADR 0026 makes authoritative; nothing else in this crate links libc.
libc.workspace = true
