# Holdfast: TCP 443 bootstrap for the bare-IP origin https://185.206.149.176
# (ADR 0014). Browsers connecting to an IP send no SNI, so this default_server
# block answers them with the Let's Encrypt IP certificate and proxies to the
# daemon's loopback TCP listener, which serves the "QUIC required"
# interstitial carrying Alt-Svc: h3=":443". The terminal app itself is served
# only over HTTP/3 on UDP 443, which holdfastd owns directly.
#
# Certificate: shortlived (~6 day) Let's Encrypt IP cert, renewed by certbot;
# the deploy hook reloads nginx.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    # Bare-IP requests arrive without SNI; catch-all name.
    server_name 185.206.149.176;

    ssl_certificate     /etc/letsencrypt/live/185.206.149.176/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/185.206.149.176/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
